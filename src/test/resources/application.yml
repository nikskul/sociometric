# Тесты работают на отдельной базе в памяти и не трогают рабочие данные из ./data
spring:
  datasource:
    url: jdbc:h2:mem:sociometric-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

sociometric:
  gsc-formula: mutual
  demo-data-on-startup: false
