server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: sociometric
  datasource:
    url: jdbc:h2:file:./data/sociometric;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

logging:
  level:
    org.hibernate.SQL: warn

sociometric:
  # Формула коэффициента групповой сплоченности:
  #   mutual  - GSC = 2*M / (n*(n-1)), где M - число взаимных пар (классическая формула Морено)
  #   mutualDoublePass - GSC = sum(A[i][j]*A[j][i]) / (n*(n-1))
  gsc-formula: mutual
  demo-data-on-startup: true
